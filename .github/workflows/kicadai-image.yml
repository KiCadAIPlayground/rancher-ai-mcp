# KiCadAIPlayground: build the upstream image ourselves (upstream only publishes to Rancher's private Prime registry).
# Run manually with an upstream tag; pushes ghcr.io/kicadaiplayground/rancher-ai-mcp:<tag>.
name: kicadai-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (e.g. v1.2.0-alpha.6)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: package/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ github.sha }}
          push: true
          tags: ghcr.io/kicadaiplayground/rancher-ai-mcp:${{ inputs.tag }}
